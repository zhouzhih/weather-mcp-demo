# Test configuration
server.port=8081

# Spring AI OpenAI configuration for testing
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-test-key}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=500

# OpenWeatherMap API configuration for testing
weather.api.key=${OPENWEATHER_API_KEY:test-key}
weather.api.url=https://api.openweathermap.org/data/2.5

# Alibaba Cloud Bailian MCP configuration for testing
alibaba.cloud.bailian.mcp.url=${ALIBABA_MCP_URL:https://test-api.example.com}
alibaba.cloud.bailian.mcp.api-key=${ALIBABA_API_KEY:test-key}
